services:
  runtime:
    image: ghcr.io/sitepilot/runtime:build
    profiles:
      - donotstart
    ports:
      - "2222:2222"
    environment:
      RUNTIME_VERBOSITY: 2
    volumes:
      - ./files:/files
    build:
      context: ./src
      target: runtime

  php-cli:
    image: ghcr.io/sitepilot/php:build
    profiles:
      - donotstart
    build:
      context: ./src
      target: php-cli

  php-fpm:
    image: ghcr.io/sitepilot/php:build-fpm
    profiles:
      - donotstart
    build:
      context: ./src
      target: php-fpm

  php-nginx:
    image: ghcr.io/sitepilot/php:build-fpm-nginx
    profiles:
      - donotstart
    ports:
      - "2080:80"
      - "2443:443"
    environment:
      RUNTIME_VERBOSITY: 2
    build:
      context: ./src
      target: php-nginx

  php-ols:
    image: ghcr.io/sitepilot/php:build-fpm-ols
    profiles:
      - donotstart
    ports:
      - "2080:80"
      - "2443:443"
    environment:
      RUNTIME_VERBOSITY: 2
    build:
      context: ./src
      target: php-ols

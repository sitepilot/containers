name: php-cli

on:
  push:
    branches:
      - '1.x'
    paths:
      - 'src/php/**'
      - 'src/Dockerfile'
      - 'php-cli.yml'
  workflow_dispatch:

jobs:
  php-cli:
    uses: ./.github/workflows/php-build.yml
    strategy:
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
      fail-fast: true
    with:
      target: php
      version: ${{ matrix.php }}
    secrets: inherit

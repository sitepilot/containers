name: php-sshd

on:
  push:
    branches:
      - '1.x'
    paths:
      - '../../src/php-sshd/**'
      - 'src/Dockerfile'
      - '.github/workflows/php-sshd.yml'
  workflow_dispatch:

jobs:
  php-sshd:
    uses: ./.github/workflows/php-build.yml
    strategy:
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
      fail-fast: true
    with:
      target: php-sshd
      version: ${{ matrix.php }}
    secrets: inherit
